name: AI Fitness Coach
options:
  bundleIdPrefix: com.unxry
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  AI Fitness Coach:
    type: application
    platform: iOS
    sources:
      - path: AI Fitness Coach
    info:
      path: AI Fitness Coach/Resources/Info.plist
    entitlements:
      path: AI Fitness Coach/Resources/AI Fitness Coach.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unxry.aifitnesscoach
        INFOPLIST_FILE: AI Fitness Coach/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
