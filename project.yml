name: AI Fitness Coach
options:
  deploymentTarget:
    iOS: "17.4"
targets:
  AI Fitness Coach:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
    sources:
      - path: AI Fitness Coach
        excludes:
          - Resources/Info.plist
          - Resources/AI Fitness Coach.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unxry.aifitnesscoach
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI Fitness Coach
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHealthShareUsageDescription: AI Fitness Coach uses steps, activity, weight, and sleep to adapt your plan.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: AI Fitness Coach does not write to Apple Health without explicit permission.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  AI Fitness Coach:
    build:
      targets:
        AI Fitness Coach: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
