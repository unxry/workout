name: AI Fitness Coach
options:
  deploymentTarget:
    iOS: "17.4"
targets:
  AI Fitness Coach:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
    sources:
      - path: AI Fitness Coach
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unxry.aifitnesscoach
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: AI Fitness Coach/Resources/AI Fitness Coach.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: AI Fitness Coach
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHealthShareUsageDescription: AI Fitness Coach uses steps, activity, weight, and sleep to adapt your plan.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: AI Fitness Coach does not write to Apple Health without explicit permission.
        INFOPLIST_KEY_NSCameraUsageDescription: AI Fitness Coach uses the camera to analyze meal photos when you choose to add food by photo.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: AI Fitness Coach reads selected photos to analyze food and answer questions about images you attach.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: AI Fitness Coach uses the microphone for voice food logging and voice messages to the AI coach.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: AI Fitness Coach uses speech recognition to transcribe your voice before sending or parsing it.
        INFOPLIST_KEY_NSFaceIDUsageDescription: AI Fitness Coach uses Face ID to protect your profile and fitness data when you enable app lock.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  AI Fitness CoachTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations:
      - iOS
    sources:
      - path: AI Fitness CoachTests
    dependencies:
      - target: AI Fitness Coach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.unxry.aifitnesscoach.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 62UBRUWU6H
  AI Fitness CoachUITests:
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations:
      - iOS
    sources:
      - path: AI Fitness CoachUITests
    dependencies:
      - target: AI Fitness Coach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.unxry.aifitnesscoach.uitests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 62UBRUWU6H
schemes:
  AI Fitness Coach:
    build:
      targets:
        AI Fitness Coach: all
        AI Fitness CoachTests: [test]
        AI Fitness CoachUITests: [test]
    test:
      targets:
        - AI Fitness CoachTests
        - AI Fitness CoachUITests
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
